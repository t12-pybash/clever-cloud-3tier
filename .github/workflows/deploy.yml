name: Deploy — Clever Cloud 3-Tier

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest

    env:
      TF_VAR_org_id: ${{ secrets.CC_ORG_ID }}
      TF_VAR_clever_token: ${{ secrets.CLEVER_TOKEN }}
      TF_VAR_clever_secret: ${{ secrets.CLEVER_SECRET }}
      TF_VAR_consumer_key: ${{ secrets.CC_CONSUMER_KEY }}
      TF_VAR_consumer_secret: ${{ secrets.CC_CONSUMER_SECRET }}
      TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve -no-color tfplan

      - name: Show outputs
        if: success()
        run: terraform output -no-color
